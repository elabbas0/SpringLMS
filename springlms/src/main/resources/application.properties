spring.application.name=springlms

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/springlms}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:springlms}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:springlms}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

app.jwt.secret=${APP_JWT_SECRET:change-this-dev-secret-before-production}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:43200000}
