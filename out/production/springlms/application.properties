spring.application.name=springlms

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/springlms}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:springlms}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:springlms}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# JWT — override APP_JWT_SECRET with a random 64-byte base64 string in production
app.jwt.secret=${APP_JWT_SECRET:change-this-dev-secret-before-production}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:43200000}

# File storage — override APP_STORAGE_PATH in production (must be a persistent volume)
app.storage.path=${APP_STORAGE_PATH:./uploads}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persistAuthorization=true
springdoc.swagger-ui.deepLinking=true
